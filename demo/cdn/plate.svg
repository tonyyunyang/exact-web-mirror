<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 180" width="640" height="180" role="img" aria-label="Calibration plate">
  <defs>
    <linearGradient id="ramp" x1="0" x2="1">
      <stop offset="0"    stop-color="#10132B"/>
      <stop offset="0.55" stop-color="#FFB03A"/>
      <stop offset="1"    stop-color="#FF3DA5"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#EDEAF6" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="640" height="180" fill="#171B3A"/>
  <rect width="640" height="180" fill="url(#grid)"/>

  <!-- gradient ramp -->
  <rect x="24" y="28" width="592" height="26" fill="url(#ramp)" rx="2"/>

  <!-- resolution wedge: bars halving in pitch, left to right -->
  <g fill="#EDEAF6" fill-opacity="0.85">
    <rect x="24"  y="72" width="8" height="44"/><rect x="40"  y="72" width="8" height="44"/>
    <rect x="56"  y="72" width="8" height="44"/><rect x="72"  y="72" width="8" height="44"/>
    <rect x="96"  y="72" width="5" height="44"/><rect x="106" y="72" width="5" height="44"/>
    <rect x="116" y="72" width="5" height="44"/><rect x="126" y="72" width="5" height="44"/>
    <rect x="146" y="72" width="3" height="44"/><rect x="152" y="72" width="3" height="44"/>
    <rect x="158" y="72" width="3" height="44"/><rect x="164" y="72" width="3" height="44"/>
    <rect x="182" y="72" width="2" height="44"/><rect x="186" y="72" width="2" height="44"/>
    <rect x="190" y="72" width="2" height="44"/><rect x="194" y="72" width="2" height="44"/>
  </g>

  <!-- patches -->
  <g>
    <rect x="228" y="72" width="44" height="44" fill="#FFB03A" rx="2"/>
    <rect x="280" y="72" width="44" height="44" fill="#FF3DA5" rx="2"/>
    <rect x="332" y="72" width="44" height="44" fill="#EDEAF6" rx="2"/>
    <rect x="384" y="72" width="44" height="44" fill="#8E8AAE" rx="2"/>
    <rect x="436" y="72" width="44" height="44" fill="#1F2450" rx="2" stroke="#EDEAF6" stroke-opacity="0.2"/>
  </g>

  <!-- crosshair -->
  <g stroke="#FFB03A" stroke-width="1.5" fill="none">
    <circle cx="560" cy="94" r="22" stroke-opacity="0.7"/>
    <path d="M560 64v60M530 94h60" stroke-opacity="0.45"/>
  </g>

  <text x="24" y="150" font-family="ui-monospace, Menlo, monospace" font-size="11"
        letter-spacing="1.6" fill="#8E8AAE">CALIBRATION PLATE · ADDRESS BUILT AT RUN TIME</text>
  <text x="616" y="150" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="11"
        letter-spacing="1.6" fill="#FFB03A">TRAP 04</text>
</svg>
